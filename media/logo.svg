<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <circle cx="128" cy="128" r="86" fill="url(#glow)"/>

  <g transform="translate(128 128)" filter="url(#softShadow)">
    <rect x="-26" y="-66" width="52" height="92" rx="26" fill="url(#mic)"/>
    <path d="M -52 -8 A 52 52 0 0 0 52 -8" stroke="url(#mic)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <line x1="0" y1="44" x2="0" y2="68" stroke="url(#mic)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-22" y1="68" x2="22" y2="68" stroke="url(#mic)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g stroke="#C4B5FD" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 36 110 Q 28 128 36 146"/>
    <path d="M 22 92 Q 8 128 22 164"/>
    <path d="M 220 110 Q 228 128 220 146"/>
    <path d="M 234 92 Q 248 128 234 164"/>
  </g>
</svg>
